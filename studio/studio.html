<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JobPilot Studio</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
:root{--bg:#0d1117;--panel:#161b22;--line:#30363d;--fg:#e6edf3;--mut:#8b949e;--acc:#2f81f7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:13px system-ui;height:100vh;display:flex;flex-direction:column}
header{display:flex;gap:12px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line)}
header b{font-size:14px}#status{color:var(--mut)}.dot{width:8px;height:8px;border-radius:50%;background:#3fb950;display:inline-block;animation:p 1.5s infinite}
@keyframes p{50%{opacity:.3}}
main{flex:1;display:grid;grid-template-columns:220px 1fr 420px;min-height:0}
#tree{border-right:1px solid var(--line);overflow:auto;padding:6px 0}
#tree div{padding:3px 12px;cursor:pointer;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tree div:hover{background:var(--panel)}#tree div.on{color:var(--fg);background:#1f6feb33}#tree div.new{color:#3fb950}
#code{overflow:auto;min-width:0}#code h3{margin:0;padding:8px 14px;font:600 12px ui-monospace,monospace;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0}
pre{margin:0}code.hljs{background:transparent;font:12.5px/1.5 ui-monospace,Menlo,monospace;padding:12px 14px}
#right{border-left:1px solid var(--line);display:flex;align-items:center;justify-content:center;background:#010409}
.phone{width:380px;height:780px;border:12px solid #222;border-radius:44px;overflow:hidden;background:#fff;box-shadow:0 0 0 2px #444}
iframe{width:100%;height:100%;border:0}
@media(max-width:900px){main{grid-template-columns:1fr}#tree{display:none}#right{order:-1;padding:12px}.phone{width:100%;max-width:380px;height:680px}}
</style></head><body>
<header><span class="dot"></span><b>JobPilot Studio</b><span id="status">watching for changes…</span>
<label style="margin-left:auto;color:var(--mut)"><input type="checkbox" id="follow" checked> follow latest edit</label></header>
<main><nav id="tree"></nav><section id="code"><h3 id="fname">—</h3><pre><code id="src"></code></pre></section>
<section id="right"><div class="phone"><iframe id="app" src="/app/index.html"></iframe></div></section></main>
<script>
let cur=null,seen=new Set();
async function tree(hl){const fs=await (await fetch('/api/files')).json();const t=document.getElementById('tree');t.innerHTML='';
 fs.forEach(f=>{const d=document.createElement('div');d.textContent=f;d.title=f;if(f===cur)d.className='on';else if(!seen.has(f)&&seen.size)d.className='new';d.onclick=()=>{follow.checked=false;show(f)};t.appendChild(d)});fs.forEach(f=>seen.add(f))}
async function show(f){if(!f)return;cur=f;const s=await (await fetch('/api/file?p='+encodeURIComponent(f))).text();
 fname.textContent=f;const el=document.getElementById('src');el.textContent=s;el.removeAttribute('data-highlighted');el.className='';hljs.highlightElement(el);tree()}
new EventSource('/events').onmessage=e=>{const m=JSON.parse(e.data);status.textContent=m.file?('updated '+m.file+' · '+new Date(m.t).toLocaleTimeString()):'watching…';
 if(follow.checked&&m.file)show(m.file);else tree();app.src='/app/index.html?'+m.t};
tree();
</script></body></html>
